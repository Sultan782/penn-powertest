backend:
  name: git-gateway
  branch: main # change to 'master' if your main GitHub branch is named master

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. Products / Marketplace
  - name: "products"
    label: "Products & Marketplace"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "Seller Name", name: "seller", widget: "string" }
      - { label: "Seller WhatsApp Number", name: "whatsapp", widget: "string", default: "919995352227" }
      - { label: "Price (₹)", name: "price", widget: "number" }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Description", name: "description", widget: "text" }

  # 2. Community Announcements
  - name: "posts"
    label: "Community Announcements"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Body Content", name: "body", widget: "markdown" }