<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penn Power Marketplace</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f6f8;
      color: #333;
    }
    header {
      background-color: #0056b3;
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    .admin-link {
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,0.2);
      padding: 8px 15px;
      border-radius: 4px;
      font-size: 14px;
    }
    .admin-link:hover {
      background: rgba(255,255,255,0.3);
    }
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .search-bar {
      width: 100%;
      padding: 12px 20px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 30px;
      box-sizing: border-box;
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .product-card h3 {
      margin-top: 0;
      color: #0056b3;
    }
    .product-price {
      font-size: 18px;
      font-weight: bold;
      color: #28a745;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Penn Power Marketplace</h1>
    <a href="/adminzeeba/" class="admin-link">Admin Login</a>
  </header>

  <div class="container">
    <!-- Search Bar for Visitors -->
    <input type="text" id="searchInput" class="search-bar" placeholder="Search products..." onkeyup="filterProducts()">

    <!-- Product Grid -->
    <div id="productGrid" class="product-grid">
      <div class="product-card">
        <h3>Sample Product</h3>
        <p class="product-price">$0.00</p>
        <p>Products added by your aunt in the admin dashboard will automatically appear here once connected.</p>
      </div>
    </div>
  </div>

  <script>
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.product-card');
      cards.forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(query) ? 'block' : 'none';
      });
    }
  </script>

</body>
</html>
